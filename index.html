<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Список бажань</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="bg-container"></div>
    <header>
        <h1 id="page-title" class="glass">Список бажань</h1>
    </header>

    <main>
        <section id="wish-section">
            <h2 id="wish-section-title" class="glass">Додати нове бажання</h2>

            <form id="wish-form">
                <input type="text" id="wish-input" class="glass" placeholder="Опишіть своє бажання..." required>
                <input type="number" id="wish-cost" class="glass" placeholder="Вартість" required>
                <input type="number" id="wish-priority" class="glass" placeholder="Пріоритет (1-10)" min="1" max="10" required>
                <button type="submit" id="wish-submit" class="glass">Додати</button>
            </form>

            <ul id="wish-list"></ul>
        </section>
    </main>

    <footer>
        <div id="total-cost-container">
            <p id="total-cost" class="glass">Загальна вартість: 0$</p>
        </div>

        <p id="footer-title" class="glass">&copy; 2026 Список бажань</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/background.js"></script>
</body>
</html>
